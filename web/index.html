<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渡口 · 出海工作台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="mark">渡</span>
      <div>
        <div class="brand-name">渡口</div>
        <div class="brand-sub">一人做跨境的工作台</div>
      </div>
    </div>

    <button id="btnNew" class="btn primary wide">+ 新建商品</button>

    <div class="side-label">商品 <span id="count">0</span></div>
    <ul id="list" class="products"></ul>

    <div class="side-foot">
      <span id="health" class="dot">检查服务…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pTitle">还没有商品</h1>
        <p id="pMeta" class="muted">点左上角「新建商品」开始</p>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="image" class="tab active">套图</button>
        <button data-tab="copy" class="tab">文案</button>
        <button data-tab="video" class="tab">视频翻译</button>
        <button data-tab="ledger" class="tab">账本</button>
      </nav>
    </header>

    <section class="panel" data-panel="image">
      <div class="row">
        <label class="upload">
          <input id="file" type="file" accept="image/*" hidden>
          <span>上传原始图</span>
        </label>
        <select id="template" class="select">
          <option value="main">主图</option>
          <option value="marketing">营销图</option>
          <option value="detail">详情页</option>
        </select>
        <select id="imgLang" class="select">
          <option value="en">英语</option>
          <option value="th">泰语</option>
          <option value="vi">越南语</option>
        </select>
        <button id="btnImage" class="btn primary">生成套图</button>
      </div>
      <div id="assets" class="grid"></div>
      <p id="imgHint" class="hint">上传一张图，选好平台与语言，点生成。</p>
    </section>

    <section class="panel hidden" data-panel="copy">
      <div class="row">
        <select id="copyLang" class="select">
          <option value="en">英语</option>
          <option value="th">泰语</option>
          <option value="vi">越南语</option>
        </select>
        <button id="btnCopy" class="btn primary">生成文案</button>
      </div>
      <div id="copyOut" class="copy-out"></div>
    </section>

    <section class="panel hidden" data-panel="video">
      <div class="row">
        <label class="upload">
          <input id="vfile" type="file" accept="video/*" hidden>
          <span>上传视频</span>
        </label>
        <select id="vLang" class="select">
          <option value="en">英语</option>
          <option value="th">泰语</option>
        </select>
        <button id="btnVideo" class="btn primary">翻译字幕</button>
      </div>
      <div id="videoOut" class="copy-out"></div>
    </section>

    <section class="panel hidden" data-panel="ledger">
      <div class="row">
        <select id="lType" class="select">
          <option value="income">收入</option>
          <option value="cost">成本</option>
          <option value="fee">平台费</option>
          <option value="shipping">运费</option>
          <option value="ads">广告</option>
          <option value="refund">退款</option>
        </select>
        <input id="lAmount" class="input" type="number" placeholder="金额" step="0.01">
        <input id="lNote" class="input wide" placeholder="备注">
        <button id="btnLedger" class="btn primary">记一笔</button>
      </div>
      <div id="summary" class="stats"></div>
      <ul id="ledgerList" class="ledger"></ul>
    </section>

    <div id="job" class="jobbar hidden">
      <span id="jobText">任务进行中…</span>
      <div class="bar"><i id="jobBar"></i></div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h2>新建商品</h2>
    <label>商品名 <input id="newTitle" required placeholder="手作家具 / 餐桌"></label>
    <label>卖点（逗号分隔）<input id="newPoints" placeholder="实木手工, 老料新做"></label>
    <label>平台
      <select id="newPlatform">
        <option value="shopee">Shopee</option>
        <option value="lazada">Lazada</option>
        <option value="tiktok">TikTok Shop</option>
        <option value="amazon">Amazon</option>
      </select>
    </label>
    <label>原始描述 <textarea id="newRaw" rows="3" placeholder="把客户会看到的那段话粘贴进来"></textarea></label>
    <menu>
      <button value="cancel" class="btn">取消</button>
      <button id="btnCreate" value="ok" class="btn primary">创建</button>
    </menu>
  </form>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
